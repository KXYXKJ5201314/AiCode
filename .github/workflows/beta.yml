name: Beta Build

# push 到 main 时自动构建一个测试包：universal flavor、正式签名、与 release 同配置（R8/资源压缩），
# 仅 applicationId 后缀 .beta（com.kongxin.aicode.beta，可与正式版同机共存）。
# 产物上传到 Actions Artifacts（默认保留 90 天），不进 GitHub Release。
# 打 v* tag 的正式发版走 android-release.yml；合入前门禁走 ci.yml。
on:
  push:
    branches: [ main ]
    # 纯文档/资源改动不影响 APK，跳过省时间（与 ci.yml 保持一致）。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - 'LICENSE'
      - '.gitignore'
  # 允许在 Actions 页面手动触发，便于验证链路。
  workflow_dispatch:

# 同分支新提交到来时取消正在跑的旧 beta 构建，省额度。
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # versionCode 由 build.gradle.kts 的 gitCommitCount() 取 git rev-list --count HEAD，
          # 浅克隆（默认 depth=1）会得到 1，必须拉完整历史，否则版本号错乱。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # 签名准备：优先用 Secret 里的正式 keystore；Secret 未配置或内容无效时
      # 自动生成临时调试 keystore，保证 beta 包始终可安装（未签名 APK 装不上）。
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.AICODE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AICODE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AICODE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AICODE_KEY_PASSWORD }}
        run: |
          set -e
          USE_SECRET=0
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/aicode.jks
            size=$(stat -c%s app/aicode.jks)
            echo "keystore restored ($size bytes)"
            if [ "$size" -ge 1024 ]; then USE_SECRET=1; fi
          fi
          if [ "$USE_SECRET" = "1" ]; then
            STORE_PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; KEY_PASS="$KEY_PASSWORD"
          else
            echo "::warning::未配置有效 AICODE_KEYSTORE_* Secrets，使用临时调试签名（不可发布）"
            STORE_PASS=aicode-beta; ALIAS=aicode; KEY_PASS=aicode-beta
            keytool -genkeypair -v -keystore app/aicode.jks -storetype JKS -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AiCode Beta,OU=CI,O=AiCode,L=NA,S=NA,C=CN"
          fi
          {
            echo "storeFile=aicode.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > app/keystore.properties
          echo "keystore.properties generated (use_secret=$USE_SECRET)"
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 构建 universal beta（arm64-v8a + x86_64，含两套容器镜像的通用包）。
      # --stacktrace：失败时输出完整调用栈，便于定位 OOM/内存类根因。
      - name: Build universal beta APK
        run: ./gradlew :app:assembleUniversalBeta --stacktrace

      # 产物重命名为 aicode-universal-beta-<sha7>.apk，短 sha 便于区分每次构建。
      # 同时带上 R8 混淆映射（mapping.txt），供 beta 崩溃报告反混淆。
      - name: Rename APK & collect mapping
        run: |
          set -e
          mkdir -p dist
          sha7="${GITHUB_SHA::7}"
          cp "app/build/outputs/apk/universal/beta/app-universal-beta.apk" \
             "dist/aicode-universal-beta-${sha7}.apk"
          # AGP 8.x 的 mapping 输出目录是 variant 驼峰名（flavor + BuildType），
          # 即 outputs/mapping/universalBeta/，不是 outputs/mapping/universal/beta/。
          if [[ -f "app/build/outputs/mapping/universalBeta/mapping.txt" ]]; then
            cp "app/build/outputs/mapping/universalBeta/mapping.txt" \
               "dist/aicode-universal-beta-${sha7}-mapping.txt"
          fi
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicode-beta-${{ github.sha }}
          # Artifacts 默认保留 90 天，无需显式配置。
          path: |
            dist/aicode-universal-beta-*.apk
            dist/aicode-universal-beta-*-mapping.txt
          if-no-files-found: error